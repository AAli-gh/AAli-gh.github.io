<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-label="ALI"><defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0c2"/>
      <stop offset="0.28" stop-color="#d99a3a"/>
      <stop offset="0.55" stop-color="#ffcf70"/>
      <stop offset="1" stop-color="#8f5b18"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f5f7"/>
      <stop offset="0.3" stop-color="#8c929a"/>
      <stop offset="0.58" stop-color="#343940"/>
      <stop offset="1" stop-color="#11151a"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#6b3d0e"/>
      <stop offset="0.5" stop-color="#ffe2a0"/>
      <stop offset="1" stop-color="#a86c1b"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-opacity=".35"/>
    </filter>
  </defs><style>
  .p{transform-box:fill-box;transform-origin:50% 100%}
  .gold-leg{animation:rise 0.65s 0.00s cubic-bezier(.2,.8,.2,1) backwards,breathe 6.90s 1.43s ease-in-out infinite}
  .steel-leg{animation:rise 0.65s 0.12s cubic-bezier(.2,.8,.2,1) backwards}
  .neg{animation:fade 0.39s 0.45s ease backwards}
  .rib-shadow,.rib,.rib-line{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 0.91s 0.36s cubic-bezier(.4,0,.2,1) backwards}
  .rib-line{animation-delay:0.45s}
  .orb{animation:fade 0.13s 0.36s backwards}
  .halo{transform-box:fill-box;transform-origin:center;animation:fade 0.26s 1.30s backwards,pulse 2.6s 1.43s ease-out infinite}
  .word{animation:rise2 0.59s 0.78s ease backwards}
  @keyframes rise{from{opacity:0;transform:translateY(46px)}to{opacity:1;transform:none}}
  @keyframes rise2{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
  @keyframes breathe{0%,100%{filter:brightness(1)}50%{filter:brightness(1.22)}}
  @keyframes pulse{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(2.1)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect width="1000" height="1000" rx="230" fill="#11151a"/><rect x="6" y="6" width="988" height="988" rx="224" fill="none" stroke="#d99a3a" stroke-opacity=".35" stroke-width="8"/><g transform="translate(-98 137) scale(.98)"><!-- Main A mark -->
  <g filter="url(#shadow)" stroke-linejoin="round">
    <path class="gold-leg" d="M180 610 L475 130 Q500 90 530 130 L735 475 L645 545 L505 310 L310 650 Z"
          fill="url(#gold)" stroke="url(#edge)" stroke-width="6"/>
    <path class="steel-leg" d="M535 130 L755 560 L1030 560 L885 480 L805 330 L690 130 Z"
          fill="url(#steel)" stroke="url(#gold)" stroke-width="5"/>
    <!-- inner negative space -->
    <path class="neg" d="M398 520 L505 335 L590 485 L548 530 L505 455 L462 530 Z" fill="#11151a" opacity=".9"/>

    <!-- orbital ribbon -->
    <path class="rib-shadow" pathLength="1" d="M145 555 C330 395 535 385 770 475 C890 521 975 475 1035 405"
          fill="none" stroke="#11151a" stroke-width="58"/>
    <path class="rib" pathLength="1" d="M145 540 C330 380 535 370 770 460 C890 506 975 460 1035 390"
          fill="none" stroke="url(#steel)" stroke-width="42"/>
    <path class="rib-line" pathLength="1" d="M145 540 C330 380 535 370 770 460 C890 506 975 460 1035 390"
          fill="none" stroke="url(#gold)" stroke-width="6" opacity=".95"/>

    <!-- orbital sphere -->
    <circle class="halo" cx="1030" cy="390" r="46" fill="none" stroke="#ffcf70" stroke-width="3"/><g class="orb"><circle cx="1030" cy="390" r="40" fill="url(#gold)" stroke="#ffe3a2" stroke-width="5"><animateMotion dur="0.98s" begin="0.39s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".4 0 .2 1" path="M-885 150 C-700 -10 -495 -20 -260 70 C-140 116 -55 70 0 0"/></circle></g>
  </g></g></svg>
